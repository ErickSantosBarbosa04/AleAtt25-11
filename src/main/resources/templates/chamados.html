<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chamados | ThinDesk</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"><script th:src="@{/js/chamados.js}" defer></script></head><body><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><main class="workspace">
<header class="page-head"><div><div class="eyebrow">Central de suporte</div><h1>Chamados</h1><p class="muted">Registre solicitações e acompanhe a resolução.</p></div><a class="button secondary" th:href="@{/}">Ver dashboard</a></header>
<section class="panel" id="novo"><div class="panel-head"><h2>Abrir chamado</h2></div><form id="novo-chamado"><label for="titulo">Título</label><input id="titulo" name="titulo" maxlength="150" required><label for="descricao">Descrição do problema</label><textarea id="descricao" name="descricao" maxlength="4000" required></textarea><p class="error" role="alert" hidden></p><button type="submit">Registrar chamado</button></form></section>
<section class="panel"><div class="panel-head"><h2>Solicitações registradas</h2><span class="pill" th:text="${#lists.size(chamados) + ' chamados'}"></span></div><div class="table-wrap"><table><thead><tr><th>Solicitação</th><th>Status</th><th>Responsáveis</th><th>Resolução</th></tr></thead><tbody>
<tr th:each="chamado : ${chamados}"><td><strong th:text="${chamado.titulo ?: 'Chamado técnico'}"></strong><small th:text="${chamado.descricao}"></small><small th:text="${'ID: ' + chamado.id}"></small></td><td><span class="status" th:classappend="${chamado.status == 'RESOLVIDO' ? 'done' : ''}" th:text="${chamado.status}"></span></td><td><span th:text="${chamado.usuario}"></span><small th:if="${chamado.tecnico != null}" th:text="${'Técnico: ' + chamado.tecnico}"></small></td><td>
<form th:if="${chamado.status == 'ABERTO'}" class="resolver-chamado" th:attr="data-id=${chamado.id}"><label th:for="${'solucao-' + chamado.id}">Solução aplicada</label><textarea name="solucao" th:id="${'solucao-' + chamado.id}" maxlength="4000" required></textarea><p class="error" role="alert" hidden></p><button class="secondary" type="submit">Resolver chamado</button></form><span th:if="${chamado.status != 'ABERTO'}" th:text="${chamado.solucao ?: 'Sem solução registrada'}"></span>
</td></tr><tr th:if="${#lists.isEmpty(chamados)}"><td colspan="4" class="empty">Nenhum chamado registrado.</td></tr></tbody></table></div></section><p class="note">Use apenas dados fictícios neste ambiente de demonstração compartilhado.</p></main></body></html>

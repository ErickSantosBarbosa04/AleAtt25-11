<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clientes | ThinDesk</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><main class="workspace"><header class="page-head"><div><div class="eyebrow">Central de suporte</div><h1>Clientes</h1><p class="muted">Consulta dos clientes cadastrados no sistema.</p></div><a class="button secondary" th:href="@{/}">Ver dashboard</a></header><section class="panel"><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Telefone</th><th>Setor</th></tr></thead><tbody><tr th:each="cliente : ${clientes}"><td th:text="${cliente.nome}"></td><td th:text="${cliente.telefone}"></td><td th:text="${cliente.setor}"></td></tr><tr th:if="${#lists.isEmpty(clientes)}"><td colspan="3" class="empty">Nenhum cliente cadastrado.</td></tr></tbody></table></div></section></main></body></html>
